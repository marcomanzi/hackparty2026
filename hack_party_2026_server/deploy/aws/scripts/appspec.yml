version: 0.0
os: linux
files:
  - source: /vendor/
    destination: /home/ec2-user/serverpod/upload/vendor/
  - source: /hack_party_2026_server/
    destination: /home/ec2-user/serverpod/upload/hack_party_2026_server/
hooks:
  BeforeInstall:
    - location: hack_party_2026_server/deploy/aws/scripts/install_dependencies
      timeout: 300
      runas: root
  ApplicationStart:
    - location: hack_party_2026_server/deploy/aws/scripts/start_server
      timeout: 300
      runas: root
